<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0B0F19" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#luminaGrad)" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Outer glowing Diamond / Prism -->
  <path d="M256 72L424 256L256 440L88 256Z" fill="url(#luminaGrad)" fill-opacity="0.15" filter="url(#glow)" stroke="url(#luminaGrad)" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Core Lumina 'L' and Spark Icon -->
  <path d="M200 160V352H336" stroke="url(#innerGlow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- AI Sparkle Core -->
  <path d="M336 170L348 200L378 212L348 224L336 254L324 224L294 212L324 200Z" fill="#06b6d4" />
  <circle cx="160" cy="310" r="10" fill="#a855f7" />
